name: Build Windows Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/windows_publisher/**"
      - "client/webview2_publisher/**"
      - ".github/workflows/windows-publisher.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        run: pip install -r client/windows_publisher/requirements.txt
      - name: Verify installed browser detection
        working-directory: client/windows_publisher
        run: python -c "from totod_publisher import find_supported_browser; browser = find_supported_browser(); assert browser, 'Edge or Chrome was not detected'; print(browser)"
      - name: Test publisher listener
        working-directory: client/windows_publisher
        run: python -m unittest -v test_totod_publisher.py
      - name: Build Edge publisher client
        run: dotnet publish client/webview2_publisher/TOTOD.WebView2Publisher.csproj -c Release -r win-x64 --self-contained true -o client/webview2_publisher/dist
      - uses: actions/upload-artifact@v4
        with:
          name: TOTOD-Edge-Publisher-v0.19.4
          path: client/webview2_publisher/dist/TOTOD-Edge-Publisher-v0.19.4.exe
          if-no-files-found: error
