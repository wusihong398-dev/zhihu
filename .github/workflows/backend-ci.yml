name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: totod
          POSTGRES_USER: totod
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U totod -d totod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      APP_SECRET_KEY: 0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://totod:test-password@127.0.0.1:5432/totod
      REDIS_URL: redis://127.0.0.1:6379/0
      ACCOUNT_DATA_ROOT: /tmp/totod-accounts

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app tests
      - name: Check admin frontend
        run: node --check ../frontend/dist/assets/app.js
      - name: Check Q&A frontend
        run: node --check ../frontend/dist/assets/qa.js
      - name: Check operations frontend
        run: node --check ../frontend/dist/assets/operations.js
      - name: Run tests
        run: pytest -q
